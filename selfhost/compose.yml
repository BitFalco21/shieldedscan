# ShieldedScan from the open dataset, without indexing the chain from 2016.
#
#   docker compose --profile db up -d     Postgres, filled from the dataset (+ the follower with a node)
#   docker compose --profile api up -d    the same, plus the API on 127.0.0.1:8080
#   docker compose --profile full up -d   the same, plus the website on 127.0.0.1:3000
#
# Settings come from `.env` beside this file (copy `env.example`). See README.md.
name: shieldedscan

# libpq's variables rather than a URL, so any character in the password is safe.
x-database: &database
  PGHOST: postgres
  PGUSER: shieldedscan
  PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  PGDATABASE: shieldedscan

services:
  postgres:
    image: postgres:17
    profiles: [db, api, full]
    environment:
      POSTGRES_USER: shieldedscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: shieldedscan
    # Sized for the import's bulk load and index builds; the defaults are for a laptop.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-2GB}
      - -c
      - max_wal_size=16GB
      - -c
      - checkpoint_timeout=30min
      - -c
      - max_parallel_maintenance_workers=4
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: the database is never published beyond this machine.
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U shieldedscan -d shieldedscan]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # One-shot: imports the release, then exits 0. Re-running it resumes, or does nothing once done.
  importer:
    build:
      context: ..
      dockerfile: server/Dockerfile.selfhost-import
    profiles: [db, api, full]
    environment:
      <<: *database
      SELFHOST_REVISION: ${SELFHOST_REVISION:-main}
      # A mirror of the Hub, if you use one.
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      SELFHOST_JOBS: ${SELFHOST_JOBS:-2}
      SELFHOST_ALLOW_MISSING_COINBASE: ${SELFHOST_ALLOW_MISSING_COINBASE:-0}
      SELFHOST_MAINTENANCE_WORK_MEM: ${SELFHOST_MAINTENANCE_WORK_MEM:-1GB}
      # Set: a read-only login for your own apps once the import has passed. Unset: none.
      SELFHOST_READER_PASSWORD: ${POSTGRES_READONLY_PASSWORD:-}
    volumes:
      - downloads:/data
    # For an HF_ENDPOINT mirror on this machine.
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Continues from the release block with a synced node; without NODE_RPC_URL it exits at once
  # and the database stays at the release height.
  follower:
    build:
      context: ..
      dockerfile: server/Dockerfile.follower
    profiles: [db, api, full]
    environment:
      <<: *database
      NODE_RPC_URL: ${NODE_RPC_URL:-}
      CHAIN_INGEST_MODE: full
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$NODE_RPC_URL" ]; then echo "NODE_RPC_URL is not set: no follower, the database
        stays at the release height"; exit 0; fi; exec node follower.mjs
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      importer:
        condition: service_completed_successfully
    restart: on-failure

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    profiles: [api, full]
    environment:
      <<: *database
      # Not `:?`: Compose interpolates every service before it applies profiles, so a required
      # variable here would stop the `db` profile too. The API refuses to start without it.
      EXPLORER_API_TOKEN: ${EXPLORER_API_TOKEN:-}
      PUBLIC_API_ENABLED: "1"
      NODE_RPC_URL: ${NODE_RPC_URL:-}
      # On by default: the daily ZEC/USD history back to 2016 and currency rates load on first
      # start (no key, no node), so every USD figure and price chart fills in; also market caps,
      # swap venues, the ZIP index and names. 0 keeps the box from calling any third party.
      EXTERNAL_SOURCES: ${EXTERNAL_SOURCES:-1}
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      importer:
        condition: service_completed_successfully
    restart: unless-stopped

  # The website, reading the API above over the compose network. No assistant: it needs a model
  # host's key, and NEXT_PUBLIC_AGENT_ENABLED is not set.
  web:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile.web
      args:
        # Inlined at build: the address you open the site at, and the API's for the docs page.
        NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:${WEB_PORT:-3000}}
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:-http://127.0.0.1:${API_PORT:-8080}}
    profiles: [full]
    environment:
      CROSSCHAIN_API_URL: http://api:8080
      EXPLORER_API_TOKEN: ${EXPLORER_API_TOKEN:-}
    # Without the token the site would render its built-in sample data as if it were the chain.
    entrypoint:
      - sh
      - -c
      - >-
        if [ -z "$$EXPLORER_API_TOKEN" ]; then echo "EXPLORER_API_TOKEN is not set in .env"; exit 1;
        fi; exec node server.js
    ports:
      - 127.0.0.1:${WEB_PORT:-3000}:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  downloads:
