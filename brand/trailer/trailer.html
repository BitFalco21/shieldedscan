  const ROWS = (() => {
    const hex = "0123456789abcdef";
    const h = (n, s) =>
      Array.from({ length: n }, (_, j) => hex[Math.floor(srnd(s * 131 + j * 17 + 3) * 16)]).join(
        "",
      );
    const addrs = Array.from({ length: 9 }, (_, k) => "t1" + h(8, k * 7 + 11) + "…");
    const out = [];
    for (let i = 0; i < 26; i++) {
      const from = addrs[Math.floor(srnd(i * 13 + 5) * addrs.length)];
      let to = addrs[Math.floor(srnd(i * 29 + 9) * addrs.length)];
      if (to === from) to = addrs[(addrs.indexOf(from) + 3) % addrs.length];
      out.push({
        hash: h(10, i * 3 + 1) + "…" + h(6, i * 5 + 2),
        from,
        to,
        amt: (srnd(i * 31 + 3) * 900 + 0.4).toFixed(4),
      });
    }
    return out;
  })();

  /* ------------------------------------------------------------- scenes ---- */

  const SC = { A: 0, B: 2.3, C: 5.6, D: 9.0, E: 12.0, F: 16.2, G: 19.9, END: 24.2 };
  const GLITCHES = [
    [SC.B - 0.16, 0.3],
    [SC.D - 0.14, 0.26],
    [SC.E - 0.12, 0.24],
    [SC.F - 0.12, 0.26],
    [SC.G - 0.14, 0.34],
  ];

  /* --- A. power-on ---------------------------------------------------------- */
  function sceneA(g, t) {
    const open = eOutExpo(p(t, 0.3, 0.92));
    if (open <= 0) return;
    const hh = Math.max(3, H * open);
    g.save();
    g.beginPath();
    g.rect(0, H / 2 - hh / 2, W, hh);
    g.clip();

    g.fillStyle = C.bg;
    g.fillRect(0, 0, W, H);

    /* faint terminal grid */
    g.strokeStyle = rgba(C.green, 0.045);
    g.lineWidth = 1;
    for (let x = 0; x < W; x += 60) {
      g.beginPath();
      g.moveTo(x + 0.5, 0);
      g.lineTo(x + 0.5, H);
      g.stroke();
    }
    for (let y = 0; y < H; y += 60) {
      g.beginPath();
      g.moveTo(0, y + 0.5);
      g.lineTo(W, y + 0.5);
      g.stroke();
    }

    const lines = [
      ["> ./shieldedscan --connect mainnet", C.green, 0.48],
      ["  zakura v1.0.5 · storage=archive", C.inkFaint, 0.86],
      ["  block " + commas(DATA.height) + " · nu6.3 ironwood ACTIVE", C.inkDim, 1.22],
      [
        "  " + commas(DATA.tx24) + " tx / 24h · " + DATA.shieldedPct24 + "% fully shielded",
        C.ink,
        1.58,
      ],
    ];
    g.textBaseline = "alphabetic";
    g.textAlign = "left";
    const drift = eInCubic(p(t, 1.9, SC.B)) * 60;
    lines.forEach(([s, col, t0], i) => {
      const shown = typed(s, t, t0, 92);
      if (!shown) return;
      const y = 452 + i * 52 - drift;
      g.font = font(28, i === 0 ? 700 : 400);
      g.fillStyle = col;
      g.globalAlpha = 1 - p(t, 2.0, SC.B) * 0.8;
      g.fillText(shown, 260, y);
      if (shown.length < s.length && Math.floor(t * 6) % 2 === 0) {
        g.fillStyle = C.green;
        g.fillRect(260 + g.measureText(shown).width + 3, y - 22, 14, 26);
      }
      g.globalAlpha = 1;
    });

    /* the power-on line itself */
    const flash = 1 - p(t, 0.3, 0.58);
    if (flash > 0) {
      g.fillStyle = rgba(C.inkBright, flash);
      g.fillRect(0, H / 2 - 2, W, 4);
    }
    g.restore();
  }

  /* --- B/C. the ledger, then the shielding wave ----------------------------- */
  function ledger(g, t) {
    const X = 260,
      Y = 236,
      PW = 1400,
      PH = 660;
    const appear = p(t, SC.B, SC.B + 0.5);
    panel(g, X, Y, PW, PH, eOutCubic(appear));

    const cols = [X + 34, X + 430, X + 800, X + PW - 44];
    microlabel(g, "transaction", cols[0], Y + 44, 15, C.inkFaint, appear);
    microlabel(g, "from", cols[1], Y + 44, 15, C.inkFaint, appear);
    microlabel(g, "to", cols[2], Y + 44, 15, C.inkFaint, appear);
    microlabel(g, "value", cols[3], Y + 44, 15, C.inkFaint, appear, "right");
    g.save();
    g.globalAlpha = appear;
    g.strokeStyle = rgba(C.green, 0.18);
    g.beginPath();
    g.moveTo(X + 20, Y + 64.5);
    g.lineTo(X + PW - 20, Y + 64.5);
    g.stroke();
    g.restore();

    const rowH = 42,
      top = Y + 96,
      visible = 13;
    /* the list settles before the tracer runs — linkage and motion at once is noise */
    const scroll = clamp(t - (SC.B + 1.0), 0, 2.5) * 22;
    const vis = []; // visible rows, for the tracer below

    /* the shielding wave: sweeps bottom→top; a row it has passed is encrypted */
    const waveP = eInOut(p(t, SC.C + 0.05, SC.C + 1.15));
    const waveY = top + visible * rowH + 40 - waveP * (visible * rowH + 90);

    g.save();
    g.beginPath();
    g.rect(X + 1, top - 22, PW - 2, visible * rowH + 24);
    g.clip();

    for (let i = 0; i < visible + 2; i++) {
      const idx = (i + Math.floor(scroll / rowH)) % ROWS.length;
      const r = ROWS[idx];
      const y = top + i * rowH - (scroll % rowH);
      const rowIn = eOutCubic(p(t, SC.B + 0.18 + i * 0.045, SC.B + 0.62 + i * 0.045));
      if (rowIn <= 0) continue;
      const shielded = clamp((y - waveY) / 58, 0, 1);
      const hit = shielded > 0 && shielded < 1 ? 1 - shielded : 0;

      g.save();
      g.globalAlpha = rowIn;
      g.translate(0, (1 - rowIn) * 16);
      g.font = font(21, 400);
      g.textBaseline = "middle";
      g.textAlign = "left";

      /* row rule */
      g.strokeStyle = rgba(C.green, 0.055 + hit * 0.25);
      g.beginPath();
      g.moveTo(X + 20, y + rowH / 2 + 0.5);
      g.lineTo(X + PW - 20, y + rowH / 2 + 0.5);
      g.stroke();

      shield(g, X + 22 + 8, y + 3, 9, shielded > 0 ? 1 : 0, 0.85);

      g.fillStyle = C.inkDim;
      g.fillText(r.hash, cols[0] + 30, y + 3);

      if (shielded > 0) {
        g.fillStyle = C.greenDim;
        g.fillText("z···········", cols[1], y + 3);
        g.fillText("z···········", cols[2], y + 3);
        const bw = 168;
        redact(g, cols[3] - bw, y - 12, bw, 26, 1, 0.25 + hit * 1.6);
      } else {
        g.fillStyle = C.inkFaint;
        g.fillText(r.from, cols[1], y + 3);
        g.fillText(r.to, cols[2], y + 3);
        vis.push({ y: y + 3, from: r.from, to: r.to, w: g.measureText(r.from).width });
        g.textAlign = "right";
        g.fillStyle = C.ink;
        g.fillText(r.amt + " ZEC", cols[3], y + 3);
        g.textAlign = "left";
      }
      g.restore();
    }

    /* the surveillance tracer: a scan sweep that links rows to each other */
    const scanA = Math.min(p(t, 3.9, 4.2), 1 - p(t, SC.C, SC.C + 0.35));
    if (scanA > 0) {
      const sp = p(t, 3.9, SC.C + 0.1);
      const sy = top + sp * visible * rowH;
      g.save();
      g.globalAlpha = scanA;
      const gr = g.createLinearGradient(0, sy - 60, 0, sy + 8);
      gr.addColorStop(0, rgba(C.amber, 0));
      gr.addColorStop(1, rgba(C.amber, 0.16));
      g.fillStyle = gr;
      g.fillRect(X + 1, sy - 60, PW - 2, 68);
      g.strokeStyle = rgba(C.amber, 0.8);
      g.lineWidth = 1.5;
      g.beginPath();
      g.moveTo(X + 1, sy);
      g.lineTo(X + PW - 1, sy);
      g.stroke();
      g.restore();

      /* Linkage — the inference this explorer refuses to make. A curve is drawn
       ONLY between two cells holding the identical address: row A paid it, row B
       spent from it, so a stranger reading the ledger has joined two transactions
       to one party. Both ends are underlined so the eye can check the claim. */
      const used = new Set();
      const pairs = [];
      for (let a = 0; a < vis.length && pairs.length < 4; a++) {
        if (used.has(a)) continue;
        for (let b = 0; b < vis.length; b++) {
          if (a === b || used.has(b) || Math.abs(a - b) < 2) continue;
          if (vis[a].from !== vis[b].to) continue;
          pairs.push([a, b]);
          used.add(a);
          used.add(b);
          break;
        }
      }
      pairs.forEach(([a, b], i) => {
        const A = vis[a],
          B = vis[b];
        const reveal = eOutCubic(clamp((sy - Math.max(A.y, B.y)) / 46, 0, 1));
        if (reveal <= 0) return;
        const al = scanA * reveal;
        const ax = cols[1],
          bx2 = cols[2];
        g.save();
        g.globalAlpha = al;
        /* the two cells holding one address */
        g.strokeStyle = rgba(C.amber, 0.85);
        g.lineWidth = 1.5;
        g.beginPath();
        g.moveTo(ax, A.y + 13);
        g.lineTo(ax + A.w, A.y + 13);
        g.stroke();
        g.beginPath();
        g.moveTo(bx2, B.y + 13);
        g.lineTo(bx2 + B.w, B.y + 13);
        g.stroke();
        /* the join, routed through the gutter between the two columns */
        const x0 = ax + A.w + 10,
          x1 = bx2 - 10;
        const bow = 34 + i * 16;
        g.strokeStyle = rgba(C.amber, 0.62);
        g.lineWidth = 1.4;
        g.beginPath();
        g.moveTo(x0, A.y);
        g.bezierCurveTo(x0 + bow, A.y, x1 - bow, B.y, x1, B.y);
        g.stroke();
        g.fillStyle = C.amber;
        g.beginPath();
        g.arc(x0, A.y, 2.6, 0, 7);
        g.fill();
        g.beginPath();
        g.arc(x1, B.y, 2.6, 0, 7);
        g.fill();
        g.restore();
      });
    }
    g.restore();

    /* impact flash on the shielding beat */
    const imp = 1 - p(t, SC.C, SC.C + 0.45);
    if (imp > 0 && t > SC.C) {
      g.save();
      g.globalCompositeOperation = "lighter";
      g.globalAlpha = imp * 0.5;
      g.fillStyle = rgba(C.green, 0.18);
      g.fillRect(X, Y, PW, PH);
      g.restore();
    }
  }

  /* the "most explorers print this as zero" indictment */
  function zeroBeat(g, t) {
    const a = Math.min(p(t, 7.45, 7.75), 1 - p(t, 8.72, 8.95));
    if (a <= 0) return;
    const s = mix(0.92, 1, eOutBack(p(t, 7.45, 7.95)));
    const shatter = p(t, 8.6, 8.95);
    g.save();
    g.globalAlpha = a;
    g.translate(W / 2, 620);
    g.scale(s, s);
    g.translate(shatter * 40, 0);
    g.fillStyle = "rgba(5,8,5,0.94)";
    g.fillRect(-330, -78, 660, 156);
    g.strokeStyle = rgba(C.red, 0.5);
    g.lineWidth = 1;
    g.strokeRect(-330.5, -78.5, 661, 157);
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = font(64, 700);
    g.fillStyle = C.inkDim;
    g.fillText("0.00000000", 0, -8);
    const strike = eOutExpo(p(t, 7.95, 8.35));
    g.strokeStyle = C.red;
    g.lineWidth = 4;
    g.beginPath();
    g.moveTo(-250, -8);
    g.lineTo(-250 + 500 * strike, -8);
    g.stroke();
    microlabel(g, "a value that is not zero", 0, 48, 18, C.red, p(t, 8.1, 8.4), "center");
    g.restore();
  }

  /* --- D. the veil ---------------------------------------------------------- */
  function sceneD(g, t) {
    const a = Math.min(p(t, SC.D + 0.1, SC.D + 0.5), 1 - p(t, SC.E - 0.35, SC.E));
    if (a <= 0) return;
    g.save();
    g.globalAlpha = a;

    /* VeilPanel: a dashed frame stating what is hidden and why, and what is not */
    const PX = W / 2 - 470,
      PY = 258,
      PW = 940,
      PH = 254;
    const open = eOutExpo(p(t, SC.D + 0.1, SC.D + 0.7));
    g.save();
    g.globalAlpha = a * open;
    g.fillStyle = "rgba(10,18,10,0.75)";
    g.fillRect(PX, PY, PW, PH);
    g.setLineDash([9, 7]);
    g.strokeStyle = rgba(C.green, 0.38);
    g.lineWidth = 1.5;
    g.strokeRect(PX + 0.5, PY + 0.5, PW - 1, PH - 1);
    g.setLineDash([]);
    g.restore();

    microlabel(
      g,
      "value transferred",
      PX + 40,
      PY + 56,
      17,
      C.inkFaint,
      p(t, SC.D + 0.3, SC.D + 0.6),
    );

    const bw = 470,
      bh = 62,
      by = PY + 88;
    const grow = eOutExpo(p(t, SC.D + 0.35, SC.D + 1.0));
    redact(g, PX + 40, by, bw * grow, bh, 1, 0.5);

    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    g.globalAlpha = a * p(t, SC.D + 0.85, SC.D + 1.2);
    g.font = font(22, 400);
    g.fillStyle = C.inkDim;
    g.fillText("hidden by design — encrypted on-chain", PX + 40, by + bh + 50);
    g.globalAlpha = a;

    /* the other half of the rule: what IS public is still shown */
    const rx = PX + 560;
    microlabel(g, "still public", rx, PY + 56, 17, C.inkFaint, p(t, SC.D + 0.55, SC.D + 0.85));
    /* 4 logical actions × 5,000 zat is the ZIP-317 convention — arithmetic, not a guess */
    [
      ["pool", "IRONWOOD"],
      ["logical actions", "4"],
      ["fee", "0.00020000 ZEC"],
    ].forEach(([k, v], i) => {
      const al = p(t, SC.D + 0.8 + i * 0.12, SC.D + 1.1 + i * 0.12);
      if (al <= 0) return;
      const ly = PY + 106 + i * 44;
      g.save();
      g.globalAlpha = a * al;
      microlabel(g, k, rx, ly, 14, C.inkFaint, 1);
      g.font = font(21, 700);
      g.textAlign = "right";
      g.fillStyle = C.ink;
      g.fillText(v, PX + PW - 40, ly);
      g.restore();
    });

    /* the shield grammar */
    const defs = [
      ["transparent", 0],
      ["mixed", 0.5],
      ["shielded", 1],
    ];
    defs.forEach(([label, fill], i) => {
      const t0 = SC.D + 1.45 + i * 0.22;
      const k = eOutBack(p(t, t0, t0 + 0.5));
      if (k <= 0) return;
      const x = W / 2 - 300 + i * 300,
        y = 700;
      g.save();
      g.globalAlpha = a * clamp(p(t, t0, t0 + 0.3), 0, 1);
      g.translate(x, y);
      g.scale(k, k);
      shield(g, 0, 0, 46, fill, 1);
      g.restore();
      microlabel(
        g,
        label,
        x,
        y + 96,
        17,
        fill >= 1 ? C.green : C.inkDim,
        a * p(t, t0 + 0.15, t0 + 0.45),
        "center",
      );
    });
    g.restore();
  }

  /* --- E. analytics --------------------------------------------------------- */
  const SERIES_MAX = Math.max(...SERIES.map((r) => r[0] + r[1] + r[2] + r[3]));
  /* Ink weight per pool is meaningful, not decorative: the current protocol is
   full green, the 2016 pool nobody should use is faintest. One table, so the
   bands and the legend swatches cannot drift apart. */
  const POOL_INK = { ORCHARD: 1.0, SAPLING: 0.44, IRONWOOD: 0.66, SPROUT: 0.18 };

  function poolsChart(g, x, y, w, h, t) {
    const draw = eInOut(p(t, SC.E + 0.3, SC.E + 1.85));
    microlabel(g, "shielded pools · monthly closing balance", x + 26, y + 40, 16, C.green, 1);

    const bx = x + 26,
      by = y + 74,
      bw = w - 52,
      bh = h - 172;
    const N = SERIES.length - 1;
    const px = (i) => bx + (i / N) * bw;
    const py = (v) => by + bh - (v / SERIES_MAX) * bh;

    /* gridlines — this chart plots real figures, so it may carry a scale */
    g.save();
    g.globalAlpha = 0.5;
    g.strokeStyle = rgba(C.green, 0.1);
    g.lineWidth = 1;
    for (let k = 1; k <= 4; k++) {
      const gy = Math.round(by + bh - (bh * k) / 4) + 0.5;
      g.beginPath();
      g.moveTo(bx, gy);
      g.lineTo(bx + bw, gy);
      g.stroke();
    }
    g.restore();
    microlabel(
      g,
      "5M ZEC",
      bx + bw,
      by - 12,
      13,
      C.inkFaint,
      p(t, SC.E + 1.5, SC.E + 1.9),
      "right",
    );

    g.save();
    g.beginPath();
    g.rect(bx, by - 20, bw * draw + 1, bh + 22);
    g.clip();

    /* stacked bands, oldest pool at the bottom; ink grammar = green opacity steps */
    const order = [0, 1, 2, 3]; // sprout, sapling, orchard, ironwood
    const alphas = [POOL_INK.SPROUT, POOL_INK.SAPLING, POOL_INK.ORCHARD, POOL_INK.IRONWOOD];
    const base = new Array(SERIES.length).fill(0);
    order.forEach((si, k) => {
      const topY = SERIES.map((r, i) => base[i] + r[si]);
      g.beginPath();
      for (let i = 0; i <= N; i++) g[i ? "lineTo" : "moveTo"](px(i), py(topY[i]));
      for (let i = N; i >= 0; i--) g.lineTo(px(i), py(base[i]));
      g.closePath();
      g.fillStyle = rgba(C.green, 0.06 + alphas[k] * 0.3);
      g.fill();
      g.strokeStyle = rgba(C.green, 0.28 + alphas[k] * 0.55);
      g.lineWidth = 1.6;
      g.beginPath();
      for (let i = 0; i <= N; i++) g[i ? "lineTo" : "moveTo"](px(i), py(topY[i]));
      g.stroke();
      for (let i = 0; i <= N; i++) base[i] = topY[i];
    });

    /* the leading edge glows as it draws */
    if (draw > 0 && draw < 1) {
      const ex = bx + bw * draw;
      g.save();
      g.globalCompositeOperation = "lighter";
      const lg = g.createLinearGradient(ex - 90, 0, ex, 0);
      lg.addColorStop(0, rgba(C.green, 0));
      lg.addColorStop(1, rgba(C.green, 0.3));
      g.fillStyle = lg;
      g.fillRect(ex - 90, by, 90, bh);
      g.fillStyle = rgba(C.green, 0.9);
      g.fillRect(ex - 1.5, by, 2, bh);
      g.restore();
    }
    g.restore();

    microlabel(g, "2016", bx, by + bh + 26, 13, C.inkFaint, p(t, SC.E + 0.5, SC.E + 0.9));
    microlabel(
      g,
      "2026",
      bx + bw,
      by + bh + 26,
      13,
      C.inkFaint,
      p(t, SC.E + 1.5, SC.E + 1.9),
      "right",
    );

    /* legend, with each pool's real share of shielded value today */
    DATA.pools.forEach((pool, i) => {
      const t0 = SC.E + 1.35 + i * 0.1;
      const al = p(t, t0, t0 + 0.3);
      if (al <= 0) return;
      const lx = x + 26 + i * 214,
        ly = y + h - 34;
      g.save();
      g.globalAlpha = al;
      g.fillStyle = rgba(C.green, 0.06 + POOL_INK[pool.name] * 0.3);
      g.fillRect(lx, ly - 26, 12, 12);
      microlabel(g, pool.name, lx + 20, ly - 16, 13, C.inkDim, 1);
      g.font = font(17, 700);
      g.fillStyle = C.ink;
      g.textAlign = "left";
      g.fillText(pool.pct.toFixed(2) + "%", lx + 20, ly + 8);
      g.restore();
    });
  }

  function statTile(g, x, y, w, h, label, value, sub, t, t0) {
    const k = eOutExpo(p(t, t0, t0 + 0.55));
    if (k <= 0) return;
    g.save();
    g.globalAlpha = clamp(p(t, t0, t0 + 0.3), 0, 1);
    g.translate(0, (1 - k) * 22);
    panel(g, x, y, w, h, 1);
    microlabel(g, label, x + 22, y + 34, 14, C.inkFaint, 1);
    g.font = font(40, 700);
    g.fillStyle = C.inkBright;
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    g.fillText(value, x + 22, y + 86);
    if (sub) microlabel(g, sub, x + 22, y + 114, 14, C.green, 1);
    g.restore();
  }

  /** A Sankey ribbon: contiguous at the boundary, spread at the node end. */
  function ribbon(g, x0, y0, x1, y1, th0, th1, colour, a) {
    const mx = (x0 + x1) / 2;
    g.save();
    g.globalAlpha = a;
    g.fillStyle = colour;
    g.beginPath();
    g.moveTo(x0, y0 - th0 / 2);
    g.bezierCurveTo(mx, y0 - th0 / 2, mx, y1 - th1 / 2, x1, y1 - th1 / 2);
    g.lineTo(x1, y1 + th1 / 2);
    g.bezierCurveTo(mx, y1 + th1 / 2, mx, y0 + th0 / 2, x0, y0 + th0 / 2);
    g.closePath();
    g.fill();
    g.restore();
  }

  function sankey(g, x, y, w, h, t) {
    microlabel(g, "cross-chain · all-time zec leaving zcash", x + 26, y + 40, 16, C.green, 1);
    const bx = x + 58,
      bw = w - 250,
      by = y + 74,
      bh = h - 116;
    const rows = DATA.flowsOut.concat([
      ["+ " + DATA.flowsOutRestChains + " MORE", DATA.flowsOutRest],
    ]);
    const total = rows.reduce((s, f) => s + f[1], 0);
    const gap = bh / rows.length;

    /* the boundary bar: ribbons stack against it with no gaps, so their
     thicknesses sum to it — a budget, not a bundle of arrows */
    const barK = eOutCubic(p(t, SC.E + 0.55, SC.E + 0.95));
    g.save();
    g.globalAlpha = barK;
    g.fillStyle = C.green;
    g.fillRect(bx - 8, by, 5, bh * barK);
    g.restore();
    microlabel(g, "zcash", bx - 12, by - 14, 13, C.green, barK, "right");

    let off = 0;
    rows.forEach((f, i) => {
      const t0 = SC.E + 0.75 + i * 0.085;
      const k = eOutCubic(p(t, t0, t0 + 0.75));
      const th = Math.max(2.5, (f[1] / total) * bh);
      const y0 = by + off + th / 2;
      const y1 = by + gap * i + gap / 2;
      off += th;
      if (k <= 0) return;
      const colour = i < DATA.flowsOut.length ? C.flow[i % C.flow.length] : C.flowRest;
      ribbon(
        g,
        bx,
        y0,
        bx + bw * k,
        mix(y0, y1, eInOut(k)),
        th,
        mix(th, Math.max(2.5, th * 0.8), k),
        colour,
        0.55 * k,
      );
      if (k > 0.6) {
        const al = (k - 0.6) / 0.4;
        microlabel(g, f[0], bx + bw + 16, y1 + 5, 14, colour, al);
        g.save();
        g.globalAlpha = al * 0.8;
        g.font = font(13, 400);
        g.textAlign = "left";
        g.fillStyle = C.inkFaint;
        g.fillText(commas(f[1]) + " ZEC", bx + bw + 16, y1 + 24);
        g.restore();
      }
    });
  }

  function sceneE(g, t) {
    const a = Math.min(p(t, SC.E, SC.E + 0.35), 1 - p(t, SC.F - 0.3, SC.F));
    if (a <= 0) return;
    const push = mix(1, 1.035, eInOut(p(t, SC.E, SC.F)));
    g.save();
    g.globalAlpha = a;
    g.translate(W / 2, H / 2);
    g.scale(push, push);
    g.translate(-W / 2, -H / 2);

    panel(g, 148, 178, 906, 490, eOutExpo(p(t, SC.E + 0.1, SC.E + 0.6)));
    poolsChart(g, 148, 178, 906, 490, t);

    panel(g, 1078, 178, 694, 490, eOutExpo(p(t, SC.E + 0.2, SC.E + 0.7)));
    sankey(g, 1078, 178, 694, 490, t);

    const tw = 391,
      tg = 20;
    statTile(
      g,
      148,
      694,
      tw,
      152,
      "block height",
      commas(DATA.height),
      "live · one archive node",
      t,
      SC.E + 0.45,
    );
    statTile(
      g,
      148 + (tw + tg),
      694,
      tw,
      152,
      "fully shielded / 24h",
      DATA.shieldedPct24 + "%",
      commas(DATA.shieldedTx24) + " of " + commas(DATA.tx24) + " txs",
      t,
      SC.E + 0.58,
    );
    statTile(
      g,
      148 + 2 * (tw + tg),
      694,
      tw,
      152,
      "shielded value",
      commas(DATA.shieldedZec) + " ZEC",
      "of " + commas(DATA.circulatingZec) + " circulating",
      t,
      SC.E + 0.71,
    );
    statTile(
      g,
      148 + 3 * (tw + tg),
      694,
      tw,
      152,
      "cross-chain transfers",
      commas(DATA.transfers),
      "a floor, not a total",
      t,
      SC.E + 0.84,
    );
    g.restore();
  }

  /* --- F. the API ----------------------------------------------------------- */
  /* The real /v1/status body, keys in the order the endpoint emits them. Trimmed
   to fit, and the ellipsis line says so — a viewer who runs the command must see
   what the screen showed. An earlier cut highlighted `"keyless": true` here,
   which /v1/status does NOT return: that field belongs to the /v1 descriptor.
   Copying a key across endpoints is the same failure as a comment asserting
   data that isn't there. */
  const JSON_LINES = [
    ["{", C.inkFaint],
    ['  "height": ', C.inkDim, String(DATA.height), C.amber],
    ['  "priceUsd": ', C.inkDim, String(DATA.price), C.amber],
    ['  "txCount24h": ', C.inkDim, String(DATA.tx24), C.amber],
    [
      '  "fullyShieldedPct24h": ',
      C.inkDim,
      '{ "pct": ' +
        DATA.shieldedPct24 +
        ', "numerator": ' +
        DATA.shieldedTx24 +
        ', "denominator": ' +
        DATA.tx24 +
        " }",
      C.green,
    ],
    ["  … 6 more fields", C.inkFaint],
    ["}", C.inkFaint],
  ];

  function sceneF(g, t) {
    const a = Math.min(p(t, SC.F, SC.F + 0.3), 1 - p(t, SC.G - 0.25, SC.G));
    if (a <= 0) return;
    const k = eOutExpo(p(t, SC.F, SC.F + 0.6));
    g.save();
    g.globalAlpha = a;
    const X = 250,
      Y = 250,
      PW = 1240,
      PH = 560;
    g.translate(W / 2, H / 2);
    g.scale(mix(0.94, 1, k), mix(0.94, 1, k));
    g.translate(-W / 2, -H / 2);
    panel(g, X, Y, PW, PH, 1);

    /* title bar */
    g.save();
    g.fillStyle = rgba(C.green, 0.06);
    g.fillRect(X + 1, Y + 1, PW - 2, 44);
    microlabel(g, "api.shieldedscan.xyz", X + 24, Y + 30, 15, C.green, 1);
    g.restore();

    const cmd = "$ curl -s https://api.shieldedscan.xyz/v1/status";
    const shown = typed(cmd, t, SC.F + 0.35, 52);
    g.font = font(26, 700);
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    g.fillStyle = C.green;
    g.fillText(shown, X + 34, Y + 108);
    if (shown.length < cmd.length && Math.floor(t * 6) % 2 === 0) {
      g.fillStyle = C.green;
      g.fillRect(X + 34 + g.measureText(shown).width + 3, Y + 86, 13, 26);
    }

    /* streaming JSON */
    JSON_LINES.forEach((ln, i) => {
      const t0 = SC.F + 1.25 + i * 0.11;
      const al = p(t, t0, t0 + 0.22);
      if (al <= 0) return;
      const y = Y + 168 + i * 44;
      g.save();
      g.globalAlpha = al;
      g.translate((1 - eOutCubic(al)) * 14, 0);
      g.font = font(23, 400);
      g.fillStyle = ln[1];
      g.fillText(ln[0], X + 34, y);
      if (ln[2]) {
        const wx = X + 34 + g.measureText(ln[0]).width;
        g.fillStyle = ln[3];
        g.fillText(ln[2], wx, y);
      }
      g.restore();
    });

    /* highlight the line that is the whole argument: a percentage never travels
     without its denominator */
    const hl = p(t, SC.F + 2.35, SC.F + 2.6);
    if (hl > 0) {
      const y = Y + 168 + 4 * 44;
      g.save();
      g.globalAlpha = hl * (0.75 + 0.25 * Math.sin(t * 9));
      g.strokeStyle = C.green;
      g.lineWidth = 1.5;
      g.strokeRect(X + 24.5, y - 32.5, 1152, 46);
      g.restore();
    }

    /* chips */
    ["keyless", "rate-limited", "no accounts", "documented"].forEach((s, i) => {
      const t0 = SC.F + 1.9 + i * 0.12;
      const al = p(t, t0, t0 + 0.3);
      if (al <= 0) return;
      const x = X + 700 + (i % 2) * 270,
        y = Y + 400 + Math.floor(i / 2) * 62;
      g.save();
      g.globalAlpha = al;
      g.translate(0, (1 - eOutBack(p(t, t0, t0 + 0.5))) * 14);
      g.strokeStyle = rgba(C.green, 0.4);
      g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, 240, 44);
      g.fillStyle = rgba(C.green, 0.07);
      g.fillRect(x, y, 240, 44);
      microlabel(g, s, x + 120, y + 29, 16, C.green, 1, "center");
      g.restore();
    });
    g.restore();
  }

  /* --- G. end card ---------------------------------------------------------- */
  function sceneG(g, t) {
    const a = p(t, SC.G + 0.05, SC.G + 0.3);
    if (a <= 0) return;
    g.save();
    g.globalAlpha = a;

    const rise = eOutExpo(p(t, SC.G + 0.1, SC.G + 0.9));
    const cy = 452 + (1 - rise) * 26;

    withBloom(
      (bg) => {
        bg.textAlign = "center";
        bg.textBaseline = "alphabetic";
        rasterText(bg, "./shieldedscan", W / 2, cy, 104, 800, C.green, "center");
      },
      26,
      0.55,
    );

    /* rule */
    const rw = eOutExpo(p(t, SC.G + 0.7, SC.G + 1.3)) * 720;
    g.fillStyle = rgba(C.green, 0.35);
    g.fillRect(W / 2 - rw / 2, cy + 44, rw, 1);

    /* the URL, written */
    const url = "shieldedscan.xyz";
    const shown = typed(url, t, SC.G + 1.25, 12);
    g.font = font(66, 700);
    g.textAlign = "left";
    g.textBaseline = "alphabetic";
    const full = g.measureText(url).width;
    const sx = W / 2 - full / 2;
    const wShown = g.measureText(shown).width;
    withBloom(
      (bg) => {
        bg.font = font(66, 700);
        bg.textAlign = "left";
        bg.textBaseline = "alphabetic";
        bg.fillStyle = C.inkBright;
        bg.fillText(shown, sx, cy + 136);
        const blink = t > SC.G + 2.7 ? Math.floor(t * 2) % 2 === 0 : true;
        if (blink) {
          bg.fillStyle = C.green;
          bg.fillRect(sx + wShown + 6, cy + 136 - 48, 26, 56);
        }
      },
      18,
      0.42,
    );

    microlabel(
      g,
      "keyless public api · api.shieldedscan.xyz/v1",
      W / 2,
      cy + 206,
      20,
      C.inkDim,
      p(t, SC.G + 2.5, SC.G + 2.9),
      "center",
    );
    g.restore();
  }

  /* -------------------------------------------------------------- post fx --- */

  window.__frame = function (frame) {
    const t = frame / FPS;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);

    if (t < SC.B) {
      sceneA(ctx, t);
    } else if (t < SC.D) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      const camY = eInOut(p(t, SC.B, SC.D)) * -30;
      const camS = mix(1.0, 1.06, eInOut(p(t, SC.B, SC.D)));
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(camS, camS);
      ctx.translate(-W / 2, -H / 2 + camY);
      ledger(ctx, t);
      ctx.restore();
      /* the table falls back behind the indictment card */
      const scrim = p(t, 7.5, 7.9) * 0.74 * (1 - p(t, 8.75, 9.0));
      if (scrim > 0) {
        ctx.fillStyle = rgba(C.bg, scrim);
        ctx.fillRect(0, 0, W, H);
      }
      zeroBeat(ctx, t);
      headline(ctx, "A PUBLIC LEDGER SHOWS EVERYTHING.", t, SC.B + 0.55, 5.35, 950);
      subline(ctx, "sender · receiver · amount · forever", t, SC.B + 0.9, 4.4, 986);
      subline(ctx, "the same address, traced across transactions", t, 4.5, 5.35, 986);
      headline(ctx, "ZCASH ENCRYPTS THE REST.", t, SC.C + 0.15, 7.5, 950);
    } else if (t < SC.E) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      sceneD(ctx, t);
      headline(ctx, "WE RENDER IT AS WHAT IT IS.", t, SC.D + 0.5, SC.E - 0.2, 962);
      subline(ctx, "never a zero · never an empty cell", t, SC.D + 0.85, SC.E - 0.2, 998);
    } else if (t < SC.F) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      sceneE(ctx, t);
      headline(ctx, "POOLS. SUPPLY. CROSS-CHAIN FLOW.", t, SC.E + 1.9, SC.F - 0.2, 1010);
    } else if (t < SC.G) {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      sceneF(ctx, t);
      headline(ctx, "AND ALL OF IT, AS AN OPEN API.", t, SC.F + 2.6, SC.G - 0.2, 1010);
    } else {
      ctx.fillStyle = C.bg;
      ctx.fillRect(0, 0, W, H);
      sceneG(ctx, t);
    }

    glitch(ctx, t, GLITCHES);

    /* phosphor persistence: bright pixels leave a decaying trail */
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.16;
    ctx.drawImage(prev, 0, 0);
    ctx.restore();
    prevc.setTransform(1, 0, 0, 1, 0, 0);
    prevc.clearRect(0, 0, W, H);
    prevc.drawImage(c, 0, 0);

    postfx(ctx, t, frame);
  };

  window.__ready = (async () => {
    await document.fonts.load("700 100px JBM");
    await document.fonts.load("400 24px JBM");
    await document.fonts.load("800 100px JBM");
    await document.fonts.ready;
    return true;
  })();
  window.__meta = { W, H, FPS, frames: Math.round(SC.END * FPS) };
</script>
